name: kkkk_app
description: Kerja Kahwin Kuala Kangsar - Wedding Business Management Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.2.0

  # Calendar
  table_calendar: ^3.1.2

  # Image picking (gallery / camera / file) - works on mobile, web, desktop
  image_picker: ^1.1.2
  file_picker: ^8.0.6

  # Google Calendar API
  googleapis: ^13.2.0
  google_sign_in: ^6.2.1
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  cached_network_image: ^3.4.1
  pdf: ^3.11.1
  printing: ^5.13.1
  csv: ^6.0.0
  excel: ^4.0.6
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
